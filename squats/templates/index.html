<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pose Estimation</title>
</head>
<body>
    <h1>Pose Estimation</h1>
    <video id="videoElement" autoplay></video>
    <p id="feedback">Pose Feedback</p>

    <script>
        const videoElement = document.getElementById("videoElement");
        const feedback = document.getElementById("feedback");

        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => videoElement.srcObject = stream)
            .catch(error => console.error("Error accessing webcam:", error));

        async function processFrame() {
            const canvas = document.createElement("canvas");
            canvas.width = videoElement.videoWidth;
            canvas.height = videoElement.videoHeight;
            const context = canvas.getContext("2d");
            context.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append("frame", blob);

                const response = await fetch("/process_frame", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();
                feedback.textContent = data.pose_correct ? "Correct Pose!" : "Adjust Pose!";
                feedback.style.color = data.pose_correct ? "green" : "red";
            }, "image/jpeg");
        }

        setInterval(processFrame, 1000);
    </script>
</body>
</html>
